<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<title>PlantMaster Control Center</title>
<link rel="stylesheet" href="admin.css?v=1.9.1">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div class="auth-wrap" id="authScreen">
  <form class="auth-card" id="loginForm">
    <div class="auth-logo">PM</div>
    <h1>Control Center</h1>
    <small>HSB Fix Services · Platform administration</small>

    <div class="error-box" id="loginError" hidden></div>

    <label class="field">
      <span>Email</span>
      <input type="email" id="loginEmail" autocomplete="username" required>
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </label>

    <button class="primary block" id="loginBtn" type="submit">Sign in</button>
    <button class="ghost block" id="forgotBtn" type="button" style="margin-top:9px">Forgot password</button>
  </form>
</div>

<!-- ================= RESET PASSWORD ================= -->
<div class="auth-wrap" id="resetScreen" hidden>
  <form class="auth-card" id="resetForm">
    <div class="auth-logo">PM</div>
    <h1>Set a new password</h1>
    <small>Choose a new password for your admin account.</small>
    <div class="error-box" id="resetError" hidden></div>
    <label class="field" style="margin-top:18px">
      <span>New password</span>
      <input type="password" id="newPassword" minlength="8" autocomplete="new-password" required>
    </label>
    <button class="primary block" type="submit">Save password</button>
  </form>
</div>

<!-- ================= APP ================= -->
<div id="app">

  <header class="topbar">
    <div class="brand-mark">PM</div>
    <div class="who">
      <strong>PlantMaster Pro</strong>
      <small id="adminRole">Super admin</small>
    </div>
    <button class="sm ghost" id="logoutBtn">Logout</button>
  </header>

  <nav class="tabbar" id="tabbar">
    <button data-route="dashboard" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home
    </button>
    <button data-route="companies">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M9 16h6"/></svg>
      Companies
    </button>
    <button data-route="requests">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      Approvals
    </button>
    <button data-route="accounts">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
      Accounts
    </button>
    <button data-route="more">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      More
    </button>
  </nav>

  <main id="view"></main>
</div>

<div id="toast"></div>
<div id="modalRoot"></div>

<script type="module" src="app.js?v=1.9.1"></script>
</body>
</html>

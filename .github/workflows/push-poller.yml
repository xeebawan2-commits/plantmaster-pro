name: Push poller

# PlantMaster Pro — picks up new rows in `notifications` and delivers them as
# system push notifications to subscribed devices.
#
# SECURITY: the internal token used to live in this file in plain text. This
# repository is public, so anyone could read it and trigger delivery. It is now
# read from repository secrets. Rotate the old value.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   PUSH_FN_URL          https://<project>.supabase.co/functions/v1/web-push
#   PUSH_INTERNAL_TOKEN  same value as the function's PUSH_INTERNAL_TOKEN secret
#   SUPABASE_ANON_KEY    the publishable key from config.js

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: push-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify secrets are configured
        env:
          FN_URL: ${{ secrets.PUSH_FN_URL }}
          TOKEN: ${{ secrets.PUSH_INTERNAL_TOKEN }}
        run: |
          if [ -z "$FN_URL" ] || [ -z "$TOKEN" ]; then
            echo "::error::PUSH_FN_URL and PUSH_INTERNAL_TOKEN must be set in repository secrets."
            exit 1
          fi

      - name: Call web-push /poll
        env:
          FN_URL: ${{ secrets.PUSH_FN_URL }}
          TOKEN: ${{ secrets.PUSH_INTERNAL_TOKEN }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "${FN_URL%/}/poll" \
            -H 'Content-Type: application/json' \
            -H "X-Internal-Token: ${TOKEN}" \
            -H "apikey: ${ANON}" \
            --max-time 60 \
            --data '{}') || true
          echo "HTTP ${code}"
          head -c 800 /tmp/out.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::web-push poll failed with HTTP ${code}"
            exit 1
          fi

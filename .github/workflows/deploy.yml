name: Deploy all three sites

# ONE PUSH DEPLOYS EVERYTHING.
#
# This replaces the drag-and-drop-into-Cloudflare step. When you push to the
# branch below, GitHub builds all three properties and publishes each one to
# its own Cloudflare Pages project:
#
#   public/     -> plantmaster-pro    -> app.hsbfix.org
#   dist/site   -> plantmaster-site   -> hsbfix.org
#   dist/admin  -> plantmaster-admin  -> admin.hsbfix.org
#
# WHY THIS EXISTS
#   The built files are deliberately NOT stored in Git (public/ and dist/ are
#   in .gitignore) because they are generated — the build stamps every asset
#   with a content hash so a deploy can never serve a stale mix of old and new
#   files. Cloudflare's own Git integration cannot be used here either, because
#   your three Pages projects were created as Direct Upload projects and
#   Cloudflare does not allow converting those to Git-connected ones.
#   This workflow gives you the same "push and it is live" behaviour anyway.
#
# ONE-TIME SETUP (two secrets)
#   Settings -> Secrets and variables -> Actions -> New repository secret
#
#     CLOUDFLARE_API_TOKEN
#       dash.cloudflare.com -> My Profile -> API Tokens -> Create Token
#       -> use the "Edit Cloudflare Workers" template, or a custom token with
#          permission:  Account / Cloudflare Pages / Edit
#
#     CLOUDFLARE_ACCOUNT_ID
#       0b874a65d2b8e9cce5a5a3581f9ad3f2
#
#   After that, every push deploys. Nothing to upload by hand, ever again.

on:
  push:
    branches:
      - arena/01a0be08-plantmaster-pro
    paths-ignore:
      - '**.md'
      - 'reference/**'
      - 'supabase/**'
      - 'android/**'
      - 'tools/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which site to deploy'
        type: choice
        default: all
        options: [all, app, site, admin]

# Never let two deploys race each other.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all three properties
        run: npm run build

      - name: Confirm the build produced what we expect
        run: |
          set -e
          fail=0
          for pair in "public:index.html" "dist/site:index.html" "dist/admin:index.html"; do
            dir="${pair%%:*}"; file="${pair##*:}"
            if [ ! -f "$dir/$file" ]; then
              echo "::error::missing $dir/$file — refusing to deploy"
              fail=1
            else
              echo "ok  $dir  ($(find "$dir" -type f | wc -l) files)"
            fi
          done
          exit $fail

      # THE SUBTLE TRAP, handled.
      #
      # Your three Pages projects are Direct Upload projects. For those,
      # Cloudflare decides "is this production or just a preview?" by comparing
      # the --branch value against the project's configured production branch.
      # Get it wrong and the deploy still SUCCEEDS — it just lands on a random
      # preview URL while the custom domain keeps serving the old build. That
      # failure is silent and very easy to miss.
      #
      # So instead of hardcoding a guess, we ask the API what each project's
      # production branch actually is, and pass exactly that.
      - name: Deploy the three properties
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set -uo pipefail

          # Missing credentials is the expected first-run state. Explain it in
          # the job summary, which is readable on a phone — unlike the raw log.
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            {
              echo "## Setup needed — one time, about 3 minutes"
              echo ""
              echo "The build worked. Nothing was published yet, because this"
              echo "repository does not have your Cloudflare credentials."
              echo ""
              echo "**1. Get a token**"
              echo ""
              echo "dash.cloudflare.com -> My Profile -> API Tokens -> Create Token"
              echo "-> use the **Edit Cloudflare Workers** template -> Continue -> Create Token."
              echo "Copy the value; Cloudflare only shows it once."
              echo ""
              echo "**2. Add two secrets here**"
              echo ""
              echo "Settings -> Secrets and variables -> Actions -> New repository secret"
              echo ""
              echo "| Name | Value |"
              echo "|---|---|"
              echo "| \`CLOUDFLARE_API_TOKEN\` | the token you just copied |"
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | \`0b874a65d2b8e9cce5a5a3581f9ad3f2\` |"
              echo ""
              echo "**3. Re-run**"
              echo ""
              echo "Actions -> Deploy all three sites -> Run workflow."
              echo "After this, every push deploys on its own."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Cloudflare secrets are missing — see the job summary for the 3-minute fix."
            exit 1
          fi

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          rc=0

          # ---- Preflight -------------------------------------------------
          # If anything is wrong with the token or the account id, say exactly
          # what, in the job summary. Cloudflare's own errors are precise; the
          # problem is they are buried in the raw log, which is painful to read
          # on a phone. Nothing secret is printed — only ids and error text.
          probe=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects?per_page=1")

          ok=$(printf '%s' "$probe" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).success?"1":"0")}catch(e){process.stdout.write("x")}})')

          if [ "$ok" != "1" ]; then
            errs=$(printf '%s' "$probe" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write((j.errors||[]).map(e=>`${e.code}: ${e.message}`).join("\n")||"(no error text returned)")}catch(e){process.stdout.write("response was not JSON")}})')

            # Which accounts can this token actually see? Names the real id.
            accts=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                      "https://api.cloudflare.com/client/v4/accounts" \
                    | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(!j.success){process.stdout.write("(token cannot list accounts)");return}process.stdout.write((j.result||[]).map(a=>`| \`${a.id}\` | ${a.name} |`).join("\n")||"(none)")}catch(e){process.stdout.write("(could not read account list)")}})')

            {
              echo "## Cloudflare rejected the credentials"
              echo ""
              echo "The build is fine. The problem is the token or the account id."
              echo ""
              echo "**What Cloudflare said**"
              echo ""
              echo '```'
              echo "$errs"
              echo '```'
              echo ""
              echo "**Accounts this token can actually see**"
              echo ""
              echo "| Account ID | Name |"
              echo "|---|---|"
              echo "$accts"
              echo ""
              echo "The id currently in \`CLOUDFLARE_ACCOUNT_ID\` is \`${CLOUDFLARE_ACCOUNT_ID}\`."
              echo "If it is not in the table above, replace that secret with one that is."
              echo ""
              echo "**If the table is empty or says the token cannot list accounts**,"
              echo "the token is missing a permission. Recreate it with:"
              echo "\`Account\` → \`Cloudflare Pages\` → \`Edit\`, and under **Account Resources**"
              echo "choose **Include → your account**."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::Cloudflare rejected the credentials — see the job summary."
            exit 1
          fi

          echo "preflight ok — token and account id are valid"

          # ---- Which Pages projects actually exist in this account? -------
          # The credentials are good, so if a deploy still fails it is almost
          # certainly a project-name mismatch. List the real names so the
          # summary shows exactly what to target.
          projects=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                       "${api}?per_page=100" \
                     | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(!j.success){process.stdout.write("");return}process.stdout.write((j.result||[]).map(p=>p.name).join("\n"))}catch(e){process.stdout.write("")}})')

          echo "Pages projects in this account:"
          printf '  %s\n' $projects

          {
            echo "### Cloudflare Pages projects found in this account"
            echo ""
            if [ -z "$projects" ]; then
              echo "_None._ This account has no Pages projects, so there is nothing to deploy into."
            else
              echo '```'
              printf '%s\n' "$projects"
              echo '```'
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          have () { printf '%s\n' $projects | grep -qx "$1"; }

          deploy () {
            key="$1"; dir="$2"; project="$3"; host="$4"

            case "${TARGET:-all}" in
              ''|all) ;;
              "$key") ;;
              *) echo "skip $project (target=${TARGET})"; return 0 ;;
            esac

            echo "::group::$project  ->  $host"

            # If the project does not exist in this account, create it rather
            # than failing. A brand-new Direct Upload project is exactly what
            # `wrangler pages deploy` expects, and the custom domain is
            # attached separately in the dashboard, so this cannot disturb
            # DNS or an existing site.
            if ! have "$project"; then
              echo "::warning::$project does not exist in this account — creating it"
              npx wrangler@4 pages project create "$project" --production-branch=main \
                || echo "::warning::could not create $project"
            fi

            # Ask Cloudflare which branch counts as production for this project.
            branch=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                       "${api}/${project}" \
                     | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write((j.success&&j.result&&j.result.production_branch)||"")}catch(e){}})')

            if [ -z "$branch" ]; then
              echo "::warning::could not read production_branch for $project — falling back to 'main'"
              branch=main
            fi
            echo "production branch = $branch"

            if npx wrangler@4 pages deploy "$dir" \
                 --project-name="$project" \
                 --branch="$branch" \
                 --commit-dirty=true \
                 --commit-hash="${GITHUB_SHA}" \
                 --commit-message="${GITHUB_SHA:0:7} via GitHub Actions"; then
              echo "| $project | \`$dir\` | deployed | https://$host |" >> /tmp/summary.md
            else
              echo "::error::$project failed to deploy"
              echo "| $project | \`$dir\` | FAILED | https://$host |" >> /tmp/summary.md
              rc=1
            fi
            echo "::endgroup::"
          }

          deploy app   public     plantmaster-pro   app.hsbfix.org
          deploy site  dist/site  plantmaster-site  hsbfix.org
          deploy admin dist/admin plantmaster-admin admin.hsbfix.org

          exit $rc

      # One-off audit. The sandbox cannot reach the Cloudflare API, so the
      # runner writes the account's real state into a committed file. This
      # answers: which account is this, which Pages projects exist, and which
      # custom domains are attached to each.
      - name: Audit the Cloudflare account
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          out=cloudflare-audit.txt
          {
            echo "Cloudflare audit — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "account id in secret: ${CLOUDFLARE_ACCOUNT_ID}"
            echo ""
            echo "== accounts this token can see =="
            curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);(j.result||[]).forEach(a=>console.log(a.id,"",a.name))}catch(e){console.log("unreadable")}})'
            echo ""
            echo "== pages projects + their custom domains =="
            curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects?per_page=100" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(!j.success){console.log("error:",JSON.stringify(j.errors));return}(j.result||[]).forEach(p=>console.log(`${p.name}\n   subdomain: ${p.subdomain}\n   domains:   ${(p.domains||[]).join(", ")||"(none)"}\n   prod br:   ${p.production_branch}\n   created:   ${p.created_on}`))}catch(e){console.log("unreadable")}})'
            echo ""
            echo "== zones (domains) on this account =="
            curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones?per_page=50" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(!j.success){console.log("cannot list zones (token has no zone scope) — not a problem");return}(j.result||[]).forEach(z=>console.log(z.name,"",z.account&&z.account.name))}catch(e){console.log("unreadable")}})'
          } > "$out" 2>&1

          cat "$out"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$out"
          git commit -m "chore: cloudflare account audit [skip ci]" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Summary
        if: always()
        run: |
          # If the credentials check already wrote the setup instructions,
          # do not bury them under an empty result table.
          [ -f /tmp/summary.md ] || exit 0
          {
            echo "### Deploy result"
            echo ""
            echo "| Cloudflare project | Folder | Result | URL |"
            echo "|---|---|---|---|"
            cat /tmp/summary.md
            echo ""
            echo "A row marked FAILED usually means the API token lacks the"
            echo "**Cloudflare Pages / Edit** permission, or the project name"
            echo "does not exist in this Cloudflare account."
          } >> "$GITHUB_STEP_SUMMARY"

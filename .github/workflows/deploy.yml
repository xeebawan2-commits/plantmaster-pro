name: Deploy all three sites

# ONE PUSH DEPLOYS EVERYTHING.
#
# Builds all three properties and deploys each to the Cloudflare **Worker**
# that already owns its domain:
#
#   public/     -> worker plantmaster-pro    -> app.hsbfix.org
#   dist/site   -> worker plantmaster-site   -> hsbfix.org + www.hsbfix.org
#   dist/admin  -> worker plantmaster-admin  -> admin.hsbfix.org
#
# WHY WORKERS AND NOT PAGES
#   Your sites have been served by Workers (created 17 Sep) since before this
#   workflow existed, and those Workers hold the custom domains. Moving the
#   domains to Pages would mean detaching each one first — Cloudflare locks the
#   AAAA 100:: record a Worker owns, which is the "Unable to edit this record"
#   error you hit. Deploying to the existing Workers changes no DNS at all.
#
# WHY THE BUILT FILES ARE NOT IN GIT
#   public/ and dist/ are gitignored because they are generated: the build
#   stamps every asset with a content hash so a deploy can never serve a stale
#   mix of old and new files. That is why a build step is needed here.
#
# ONE-TIME SETUP (two secrets — already done)
#   Settings -> Secrets and variables -> Actions
#     CLOUDFLARE_API_TOKEN    "Edit Cloudflare Workers" template token
#     CLOUDFLARE_ACCOUNT_ID   0b874a65d2b8e9cce5a5a3581f9ad3f2

on:
  push:
    branches:
      - arena/01a0be08-plantmaster-pro
    paths-ignore:
      - '**.md'
      - 'reference/**'
      - 'supabase/**'
      - 'android/**'
      - 'tools/**'
      - 'cloudflare-audit.txt'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which site to deploy'
        type: choice
        default: all
        options: [all, app, site, admin]

# Never let two deploys race each other.
concurrency:
  group: deploy-sites
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --workers strips the Pages-style SPA catch-all from _redirects.
      # Workers rejects "/* /index.html 200" with "infinite loop detected"
      # (code 100324); the equivalent lives in the wrangler configs as
      # assets.not_found_handling.
      - name: Build all three properties
        run: node scripts/build.mjs --all --workers

      - name: Confirm the build produced what we expect
        run: |
          set -e
          fail=0
          for dir in public dist/site dist/admin; do
            if [ ! -f "$dir/index.html" ]; then
              echo "::error::missing $dir/index.html — refusing to deploy"
              fail=1
            else
              echo "ok  $dir  ($(find "$dir" -type f | wc -l) files)"
            fi
          done
          exit $fail

      - name: Deploy the three Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set -uo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            {
              echo "## Setup needed"
              echo ""
              echo "Add these two repository secrets, then re-run:"
              echo ""
              echo "| Name | Where to get it |"
              echo "|---|---|"
              echo "| \`CLOUDFLARE_API_TOKEN\` | Cloudflare → My Profile → API Tokens → *Edit Cloudflare Workers* |"
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | \`0b874a65d2b8e9cce5a5a3581f9ad3f2\` |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Cloudflare secrets are missing — see the job summary."
            exit 1
          fi

          # Which hostnames does each Worker actually serve? Printed in the
          # summary so a wrong-target deploy is obvious immediately.
          domains=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                      "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
                    | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(!j.success)return;const m={};(j.result||[]).forEach(d=>{(m[d.service]=m[d.service]||[]).push(d.hostname)});process.stdout.write(JSON.stringify(m))}catch(e){}})')
          [ -n "$domains" ] || domains='{}'

          hosts_for () {
            printf '%s' "$domains" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const m=JSON.parse(s);process.stdout.write((m[process.argv[1]]||[]).join(", ")||"(no custom domain yet)")}catch(e){process.stdout.write("(unknown)")}})' "$1"
          }

          rc=0
          deploy () {
            key="$1"; cfg="$2"; worker="$3"

            case "${TARGET:-all}" in
              ''|all) ;;
              "$key") ;;
              *) echo "skip $worker (target=${TARGET})"; return 0 ;;
            esac

            hosts=$(hosts_for "$worker")
            echo "::group::$worker  ->  $hosts"

            if npx wrangler@4 deploy --config "$cfg"; then
              echo "| \`$worker\` | $hosts | deployed |" >> /tmp/summary.md
            else
              echo "::error::$worker failed to deploy"
              echo "| \`$worker\` | $hosts | FAILED |" >> /tmp/summary.md
              rc=1
            fi
            echo "::endgroup::"
          }

          deploy app   wrangler.app.jsonc   plantmaster-pro
          deploy site  wrangler.site.jsonc  plantmaster-site
          deploy admin wrangler.admin.jsonc plantmaster-admin

          exit $rc

      - name: Summary
        if: always()
        run: |
          [ -f /tmp/summary.md ] || exit 0
          {
            echo "### Deploy result"
            echo ""
            echo "| Worker | Serves | Result |"
            echo "|---|---|---|"
            cat /tmp/summary.md
            echo ""
            echo "These are Cloudflare **Workers**, not Pages projects — the"
            echo "custom domains stay exactly where they are, so no DNS changes."
          } >> "$GITHUB_STEP_SUMMARY"

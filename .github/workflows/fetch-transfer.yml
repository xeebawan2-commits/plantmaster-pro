name: Fetch transfer

# Temporary bridge: the agent sandbox cannot reach wetransfer.com (TLS blocked),
# but a GitHub runner can. This downloads the transfer and commits it back to
# this branch so the sandbox can retrieve it over github.com, which IS reachable.
# Runner logs are ALSO unreachable from the sandbox, so every step appends to
# incoming/DIAG.txt which is committed unconditionally.
# Delete this workflow and incoming/ once the file is retrieved.

on:
  push:
    branches: [arena/01a0be08-plantmaster-pro]
    paths: ['.github/workflows/fetch-transfer.yml']
  workflow_dispatch:
    inputs:
      url:
        description: 'we.tl or wetransfer.com download URL'
        required: false
        default: 'https://we.tl/t-yxjsd1d7e7GVsGgf'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0be08-plantmaster-pro

      - name: Download from WeTransfer
        continue-on-error: true
        env:
          SHORT_URL: ${{ github.event.inputs.url || 'https://we.tl/t-yxjsd1d7e7GVsGgf' }}
        run: |
          mkdir -p incoming
          D=incoming/DIAG.txt
          : > "$D"
          log(){ echo "$@" | tee -a "$D"; }

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'

          log "=== 1. resolve short link ==="
          FINAL=$(curl -sSL -A "$UA" -c /tmp/cj.txt -o /tmp/page.html \
                       -w '%{url_effective}' "$SHORT_URL" 2>>"$D") || log "curl rc=$?"
          log "FINAL=$FINAL"
          log "page bytes=$(stat -c%s /tmp/page.html 2>/dev/null || echo 0)"

          # transfer id / security hash: /downloads/<tid>[/<recipient>]/<hash>
          PATHPART=${FINAL#*/downloads/}
          PATHPART=${PATHPART%%\?*}
          IFS='/' read -r P1 P2 P3 <<< "$PATHPART"
          if [ -n "$P3" ]; then TID=$P1; RID=$P2; HASH=$P3; else TID=$P1; RID=""; HASH=$P2; fi
          log "TID=$TID RID=$RID HASH=$HASH"

          CSRF=$(grep -o 'name="csrf-token" content="[^"]*"' /tmp/page.html | head -1 | cut -d'"' -f4)
          log "CSRF len=${#CSRF}"

          log "=== 2. try download APIs ==="
          if [ -n "$RID" ]; then
            B1="{\"intent\":\"entire_transfer\",\"security_hash\":\"$HASH\",\"recipient_id\":\"$RID\"}"
          else
            B1="{\"intent\":\"entire_transfer\",\"security_hash\":\"$HASH\"}"
          fi
          B2="{\"intent\":\"entire_transfer\",\"security_hash\":\"$HASH\",\"domain_user_id\":\"$(cat /proc/sys/kernel/random/uuid)\"}"

          LINK=""
          for EP in "https://wetransfer.com/api/v4/transfers/$TID/download" \
                    "https://wetransfer.com/api/v4/transfers/$TID/download?security_hash=$HASH"; do
            for BODY in "$B1" "$B2"; do
              log "--- POST $EP"
              log "    body=$BODY"
              CODE=$(curl -sS -A "$UA" -b /tmp/cj.txt -c /tmp/cj.txt \
                -H 'Content-Type: application/json' \
                -H "x-csrf-token: $CSRF" \
                -H 'x-requested-with: XMLHttpRequest' \
                -H "Referer: $FINAL" -H 'Origin: https://wetransfer.com' \
                -d "$BODY" -o /tmp/api.json -w '%{http_code}' "$EP" 2>>"$D")
              log "    http=$CODE resp=$(head -c 600 /tmp/api.json)"
              # NB: response is pretty-printed -> allow whitespace after the colon
              LINK=$(python3 -c 'import json,sys;print(json.load(open("/tmp/api.json")).get("direct_link",""))' 2>/dev/null || true)
              [ -z "$LINK" ] && LINK=$(grep -o '"direct_link"[[:space:]]*:[[:space:]]*"[^"]*"' /tmp/api.json | sed 's/.*"\(https[^"]*\)"/\1/')
              [ -n "$LINK" ] && break 2
            done
          done

          if [ -z "$LINK" ]; then
            log "=== FAILED: no direct_link ==="
            log "--- first 2500 bytes of landing page ---"
            head -c 2500 /tmp/page.html >> "$D"
            exit 0
          fi

          log "=== 3. download payload ==="
          log "LINK=${LINK:0:120}..."
          curl -sSL -A "$UA" -b /tmp/cj.txt -o incoming/payload.zip \
               -w 'http=%{http_code} bytes=%{size_download}\n' "$LINK" | tee -a "$D"
          log "$(ls -la incoming/)"
          log "--- zip listing ---"
          unzip -l incoming/payload.zip 2>&1 | head -60 | tee -a "$D" || log "not a zip"

      - name: Commit results (always)
        if: always()
        run: |
          mkdir -p incoming
          cd incoming
          if [ -f payload.zip ]; then
            SIZE=$(stat -c%s payload.zip)
            echo "payload size=$SIZE" >> DIAG.txt
            if [ "$SIZE" -gt 94371840 ]; then
              split -b 45m payload.zip payload.zip.part- && rm payload.zip
            fi
          fi
          sha256sum * > SHA256SUMS 2>/dev/null || true
          ls -la
          cd ..
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f incoming/
          git commit -m 'chore: transfer fetch attempt + diagnostics' || echo 'nothing to commit'
          git pull --rebase origin arena/01a0be08-plantmaster-pro || true
          git push origin arena/01a0be08-plantmaster-pro

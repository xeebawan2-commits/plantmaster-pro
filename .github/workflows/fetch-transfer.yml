name: Fetch transfer

# Temporary bridge: the agent sandbox cannot reach wetransfer.com (TLS blocked),
# but a GitHub runner can. This downloads the transfer and commits it back to
# this branch so the sandbox can retrieve it over github.com, which IS reachable.
# Delete this workflow and the incoming/ directory once the file is retrieved.

on:
  push:
    branches: [arena/01a0be08-plantmaster-pro]
    paths: ['.github/workflows/fetch-transfer.yml']
  workflow_dispatch:
    inputs:
      url:
        description: 'we.tl or wetransfer.com download URL'
        required: false
        default: 'https://we.tl/t-yxjsd1d7e7GVsGgf'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0be08-plantmaster-pro

      - name: Download from WeTransfer
        env:
          SHORT_URL: ${{ github.event.inputs.url || 'https://we.tl/t-yxjsd1d7e7GVsGgf' }}
        run: |
          set -x
          mkdir -p incoming
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'

          # 1. follow the short link to the real download page, keeping cookies
          FINAL=$(curl -sSL -A "$UA" -c /tmp/cj.txt -o /tmp/page.html \
                       -w '%{url_effective}' "$SHORT_URL")
          echo "FINAL=$FINAL"

          # 2. pull transfer id + security hash out of the resolved URL
          TID=$(echo "$FINAL" | sed -n 's#.*/downloads/\([0-9a-f]\{1,\}\)/.*#\1#p')
          HASH=$(echo "$FINAL" | sed -n 's#.*/downloads/[0-9a-f]\{1,\}/\([0-9a-zA-Z]\{1,\}\).*#\1#p')
          # some links carry an extra recipient segment: /downloads/<tid>/<rid>/<hash>
          if [ -z "$HASH" ]; then
            TID=$(echo  "$FINAL" | awk -F/ '{print $5}')
            HASH=$(echo "$FINAL" | awk -F/ '{print $NF}')
          fi
          echo "TID=$TID HASH=$HASH"

          # 3. csrf token from the page
          CSRF=$(grep -o 'name="csrf-token" content="[^"]*"' /tmp/page.html | head -1 | cut -d'"' -f4)
          echo "CSRF len=${#CSRF}"

          # 4. ask the API for a direct link
          for BODY in \
            "{\"intent\":\"entire_transfer\",\"security_hash\":\"$HASH\"}" \
            "{\"intent\":\"entire_transfer\",\"security_hash\":\"$HASH\",\"domain_user_id\":\"$(uuidgen)\"}" ; do
            curl -sS -A "$UA" -b /tmp/cj.txt -c /tmp/cj.txt \
              -H 'Content-Type: application/json' \
              -H "x-csrf-token: $CSRF" \
              -H 'x-requested-with: XMLHttpRequest' \
              -H "Referer: $FINAL" \
              -d "$BODY" \
              "https://wetransfer.com/api/v4/transfers/$TID/download" -o /tmp/api.json || true
            echo "--- api.json ---"; cat /tmp/api.json; echo
            LINK=$(grep -o '"direct_link":"[^"]*"' /tmp/api.json | cut -d'"' -f4)
            [ -n "$LINK" ] && break
          done

          if [ -z "$LINK" ]; then
            echo "::error::could not obtain direct_link — link may be expired or need consent"
            head -c 3000 /tmp/page.html
            exit 1
          fi

          # 5. download the payload
          curl -sSL -A "$UA" -b /tmp/cj.txt -o "incoming/payload.zip" "$LINK"
          ls -la incoming/
          file incoming/payload.zip || true
          unzip -l incoming/payload.zip | head -40 || true

      - name: Split if large, then commit back
        run: |
          set -x
          cd incoming
          SIZE=$(stat -c%s payload.zip)
          echo "size=$SIZE"
          if [ "$SIZE" -gt 94371840 ]; then
            split -b 45m payload.zip payload.zip.part-
            rm payload.zip
          fi
          sha256sum * > SHA256SUMS
          ls -la
          cd ..
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f incoming/
          git commit -m 'chore: fetched transfer payload for agent retrieval' || echo 'nothing to commit'
          git push origin arena/01a0be08-plantmaster-pro
